[project]
name = "mcpshield"
version = "0.1.0"
description = "Multi-agent runtime firewall for MCP-connected AI agents (academic PoC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.9",
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langchain-ollama>=0.3",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.36",
]

[project.optional-dependencies]
# Neural embedder + cross-encoder. Optional so the offline/CI path stays light;
# without it the RAG layer uses the deterministic hashing embedder and lexical reranker.
embeddings = ["sentence-transformers>=3.0"]
deck = ["python-pptx>=0.6.23", "kaleido>=0.2.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Hosted LLM backend (Groq, OpenAI-compatible) for the real host agent's tool calling.
groq = ["langchain-openai>=0.3"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpshield"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages insert sys.path before importing project modules, so imports are not top-of-file.
"app/**" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the api/ service lives at the repo root, outside the installed package
asyncio_mode = "auto"
addopts = "-q"
