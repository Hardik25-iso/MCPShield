# Render blueprint for MCPShield.
# Two services: the cinematic landing site (static, always-on) and the
# interactive Streamlit demo (Docker web service).
services:
  # Public front door: the cinematic explainer. Static, free, no cold start.
  - type: web
    name: mcpshield-site
    runtime: static
    branch: claude/zealous-knuth-lp9w3a
    buildCommand: "echo no build step"
    staticPublishPath: site
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Live analyzer API: runs arbitrary input through the real ShieldCore agents.
  - type: web
    name: mcpshield-api
    runtime: docker
    plan: free
    branch: claude/zealous-knuth-lp9w3a
    dockerfilePath: ./Dockerfile.api
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Real LLM agents via Groq; without GROQ_API_KEY the API falls back to the deterministic mock.
      - key: MCPSHIELD_LLM__BACKEND
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

  # Interactive demo: the Streamlit dashboard.
  - type: web
    name: mcpshield
    runtime: docker
    plan: free
    branch: claude/zealous-knuth-lp9w3a
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      # Mock LLM backend: fully offline, deterministic, no Ollama or API key needed.
      - key: MCPSHIELD_LLM__BACKEND
        value: mock
      - key: PYTHONUNBUFFERED
        value: "1"
